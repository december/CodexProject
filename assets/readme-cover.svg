  </defs>

  <rect width="1200" height="520" fill="url(#sky)"/>
  <path d="M0 405c120-54 220-50 342-4 132 50 238 48 356-5 151-68 316-42 502 20v104H0z" fill="#8fac73"/>
  <path d="M0 448c165-32 278-23 426 13 116 28 214 28 349-8 135-36 266-39 425-3v70H0z" fill="#6f955e"/>

